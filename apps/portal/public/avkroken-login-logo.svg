<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">AVKROKEN</title>
  <desc id="desc">AVKROKEN logo with terminal prompt, branching version-control nodes and digital pixels.</desc>

  <defs>
    <linearGradient id="ring" x1="150" y1="140" x2="1040" y2="1030" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22E7E8"/>
      <stop offset="0.34" stop-color="#3197FF"/>
      <stop offset="0.67" stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#D11FD0"/>
    </linearGradient>

    <linearGradient id="tech" x1="270" y1="300" x2="860" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#55F4E5"/>
      <stop offset="0.42" stop-color="#2E9BFF"/>
      <stop offset="0.72" stop-color="#6A5CFF"/>
      <stop offset="1" stop-color="#C52AE8"/>
    </linearGradient>

    <linearGradient id="tag" x1="290" y1="0" x2="930" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20D9E1"/>
      <stop offset="0.48" stop-color="#4E78F4"/>
      <stop offset="1" stop-color="#D52BCF"/>
    </linearGradient>

    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0" stop-color="#0B1222"/>
      <stop offset="0.68" stop-color="#070B13"/>
      <stop offset="1" stop-color="#05070C"/>
    </radialGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="600" cy="600" r="525" fill="url(#bg)"/>
  <circle cx="600" cy="600" r="510" fill="none" stroke="url(#ring)" stroke-width="15"/>

  <g fill="none" stroke="url(#tech)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path d="M270 410 L340 460 L270 510"/>
    <path d="M365 510 H430"/>
  </g>

  <g fill="none" stroke="url(#tech)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
