<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">AVKROKEN — Access denied</title>
  <desc id="desc">Access denied illustration in the AVKROKEN cyan, blue and magenta visual style.</desc>

  <defs>
    <linearGradient id="ring" x1="130" y1="120" x2="1070" y2="1060" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#19E4E8"/>
      <stop offset="0.36" stop-color="#2C9BFF"/>
      <stop offset="0.70" stop-color="#7757FF"/>
      <stop offset="1" stop-color="#D21BCB"/>
    </linearGradient>
    <linearGradient id="tech" x1="300" y1="260" x2="900" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#51F3E8"/>
      <stop offset="0.43" stop-color="#2D9BFF"/>
      <stop offset="0.72" stop-color="#7757FF"/>
      <stop offset="1" stop-color="#D52AC8"/>
    </linearGradient>
    <linearGradient id="denied" x1="650" y1="0" x2="975" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4E91"/>
      <stop offset="1" stop-color="#E91B67"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#0A1325"/>
      <stop offset="0.7" stop-color="#060A12"/>
      <stop offset="1" stop-color="#03050A"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="600" cy="600" r="530" fill="url(#bg)"/>
  <circle cx="600" cy="600" r="512" fill="none" stroke="url(#ring)" stroke-width="15"/>

  <g stroke="url(#tech)" stroke-width="8" stroke-linecap="round" opacity=".72">
    <path d="M300 285h52 M375 285h66 M300 320h98 M420 320h42 M300 355h34 M352 355h84"/>
    <path d="M300 430h75 M395 430h52 M300 465h40 M360 465h105 M300 500h88 M408 500h42"/>
  </g>
  <text x="265" y="415" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="54" fill="#80C8FF" opacity=".78">&lt;/&gt;</text>

  <g fill="none" stroke="url(#tech)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <rect x="540" y="205" width="210" height="190" rx="42" opacity=".8"/>
    <path d="M610 265v92M610 283l78 58"/>
    <circle cx="610" cy="265" r="27"/>
    <circle cx="610" cy="357" r="25"/>
    <circle cx="688" cy="341" r="27"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="695" cy="475" r="95" fill="#07101D" stroke="url(#ring)" stroke-width="15"/>
    <path d="M650 430l90 90M740 430l-90 90" stroke="url(#denied)" stroke-width="21" stroke-linecap="round"/>
  </g>

  <g fill="url(#tech)" opacity=".9">
    <rect x="805" y="250" width="14" height="14" rx="2"/><rect x="845" y="280" width="18" height="18" rx="2"/>
    <rect x="895" y="260" width="12" height="12" rx="2"/><rect x="935" y="305" width="16" height="16" rx="2"/>
    <rect x="790" y="330" width="12" height="12" rx="2"/><rect x="835" y="350" width="16" height="16" rx="2"/>
    <rect x="885" y="330" width="13" height="13" rx="2"/><rect x="925" y="375" width="11" height="11" rx="2"/>
    <rect x="800" y="405" width="15" height="15" rx="2"/><rect x="852" y="430" width="11" height="11" rx="2"/>
    <rect x="900" y="420" width="16" height="16" rx="2"/><rect x="950" y="455" width="12" height="12" rx="2"/>
  </g>

  <text x="600" y="710" text-anchor="middle" font-family="Inter, Avenir Next, Montserrat, Arial, sans-serif" font-size="85" font-weight="700" letter-spacing="6" fill="#F5F2EC">ACCESS <tspan fill="url(#denied)">DENIED</tspan></text>
  <text x="600" y="770" text-anchor="middle" font-family="Inter, Avenir Next, Montserrat, Arial, sans-serif" font-size="29" font-weight="400" letter-spacing="1.5" fill="#A9C6E8">Du har inte behörighet att komma åt den här resursen.</text>

  <path d="M350 845h150M700 845h150" stroke="#8CA7C3" stroke-width="3" opacity=".75"/>
  <text x="600" y="857" text-anchor="middle" font-family="Inter, Avenir Next, Montserrat, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="12" fill="#F5F2EC">AVKROKEN</text>
  <text x="600" y="920" text-anchor="middle" font-family="Inter, Avenir Next, Montserrat, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="7" fill="url(#tech)">CODE • DATA • VISIONS • IDEAS</text>
</svg>
