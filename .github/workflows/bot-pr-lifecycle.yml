name: Bot PR lifecycle

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: bot-pr-lifecycle
  cancel-in-progress: false

jobs:
  reconcile:
    name: Update and auto-merge trusted bot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Reconcile Dependabot and Copilot pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          default_branch="$(gh api "repos/${REPOSITORY}" --jq '.default_branch')"

          review_gate() {
            local number="$1" head_sha="$2" review_json
            # Called in a conditional: explicitly handle failures instead of
            # relying on errexit, which Bash disables in this context.
            # shellcheck disable=SC2016
            if ! review_json="$(gh api graphql \
              -F owner="${REPOSITORY%%/*}" -F name="${REPOSITORY#*/}" -F number="$number" \
              -f query='
                query($owner:String!, $name:String!, $number:Int!) {
                  repository(owner:$owner, name:$name) {
                    pullRequest(number:$number) {
                      headRefOid
                      reviewDecision
                      reviewThreads(first:100) {
                        nodes { isResolved }
                        pageInfo { hasNextPage }
                      }
                      reviews(first:100) {
                        nodes { author { login } state submittedAt }
                        pageInfo { hasNextPage }
                      }
                    }
                  }
                }')"; then
              echo "::warning::PR #${number} review state could not be read."
              return 1
            fi

            # Include every thread, including outdated threads. Incomplete or
            # paginated responses cannot establish that the review work is done.
            # Comments and pending reviews do not supersede a submitted decision.
            if ! jq -e --arg sha "$head_sha" '
              ((.errors // []) | length == 0) and
              (.data.repository.pullRequest |
                .headRefOid == $sha and
                has("reviewDecision") and
                (.reviewDecision == null or .reviewDecision == "APPROVED") and
                .reviewThreads.pageInfo.hasNextPage == false and
                .reviews.pageInfo.hasNextPage == false and
                (.reviewThreads.nodes | type == "array") and
                (.reviews.nodes | type == "array") and
                all(.reviewThreads.nodes[]; .isResolved == true) and
                all(.reviews.nodes[];
                  (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or
                   .state == "DISMISSED" or .state == "COMMENTED" or .state == "PENDING")) and
                ([.reviews.nodes[] |
                  select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")]
                  | all(.[]; (.author.login | type == "string") and (.submittedAt | type == "string")) and
                  (group_by(.author.login)
                    | all(.[]; (sort_by(.submittedAt) | last | .state) != "CHANGES_REQUESTED"))))
            ' <<<"$review_json" >/dev/null; then
              echo "PR #${number} has pending or unverifiable review work."
              return 1
            fi
          }

          workflow_matches_default() {
            local workflow_path="$1"
            local candidate_sha="$2"
            local default_blob candidate_blob

            if ! default_blob="$(gh api "repos/${REPOSITORY}/contents/${workflow_path}?ref=${default_branch}" --jq '.sha')"; then
              echo "::warning::Unable to read trusted ${workflow_path} on ${default_branch}."
              return 1
            fi
            if ! candidate_blob="$(gh api "repos/${REPOSITORY}/contents/${workflow_path}?ref=${candidate_sha}" --jq '.sha')"; then
              echo "::warning::Unable to read candidate ${workflow_path} on ${candidate_sha}."
              return 1
            fi
            [[ "${candidate_blob}" == "${default_blob}" ]]
          }

          reconcile_pr() {
            local number="$1"
            local pr author draft state base_ref head_repo head_ref head_sha mergeable_state
            local method url auto_merge repo_json updated_sha

            pr="$(gh api "repos/${REPOSITORY}/pulls/${number}")"
            author="$(jq -r '.user.login' <<<"${pr}")"
            case "${author}" in
              "dependabot[bot]"|"copilot-swe-agent[bot]") ;;
              *) return 0 ;;
            esac

            state="$(jq -r '.state' <<<"${pr}")"
            draft="$(jq -r '.draft' <<<"${pr}")"
            base_ref="$(jq -r '.base.ref' <<<"${pr}")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"${pr}")"
            head_ref="$(jq -r '.head.ref' <<<"${pr}")"
            head_sha="$(jq -r '.head.sha' <<<"${pr}")"
            url="$(jq -r '.html_url' <<<"${pr}")"
            [[ "${state}" == "open" && "${draft}" == "false" ]] || return 0
            [[ "${base_ref}" == "${default_branch}" && "${head_repo}" == "${REPOSITORY}" ]] || return 0

            if ! review_gate "${number}" "${head_sha}"; then
              if ! gh pr merge --disable-auto "${url}"; then
                echo "::error::PR #${number} auto-merge could not be disabled."
                return 1
              fi
              return 0
            fi

            mergeable_state="$(jq -r '.mergeable_state // "unknown"' <<<"${pr}")"
            if [[ "${mergeable_state}" == "dirty" ]]; then
              echo "PR #${number} has conflicts; manual resolution required."
              return 0
            fi

            if [[ "${mergeable_state}" == "behind" ]]; then
              echo "Updating PR #${number} from ${default_branch}."
              if ! gh api --method PUT "repos/${REPOSITORY}/pulls/${number}/update-branch" \
                -f "expected_head_sha=${head_sha}" >/dev/null; then
                echo "::warning::PR #${number} update-branch request failed; will retry on next run."
                return 0
              fi

              updated_sha="${head_sha}"
              for _ in $(seq 1 20); do
                updated_sha="$(gh api "repos/${REPOSITORY}/pulls/${number}" --jq '.head.sha')"
                [[ "${updated_sha}" != "${head_sha}" ]] && break
                sleep 3
              done
              if [[ "${updated_sha}" == "${head_sha}" ]]; then
                echo "::error::PR #${number} update was not observed; checks were not dispatched."
                return 1
              fi

              # GITHUB_TOKEN updates suppress ordinary pull_request workflow triggers.
              # Never execute bot-controlled workflow YAML. Dispatch against the PR
              # ref only when both workflow definitions are byte-identical to the
              # trusted default branch.
              if ! workflow_matches_default ".github/workflows/ci.yml" "${updated_sha}" ||
                 ! workflow_matches_default ".github/workflows/codeql.yml" "${updated_sha}"; then
                echo "::warning::PR #${number} modifies trusted workflow definitions; checks were not dispatched automatically."
                return 0
              fi
              if ! gh workflow run ci.yml --repo "${REPOSITORY}" --ref "${head_ref}"; then
                echo "::error::PR #${number} CI dispatch failed."
                return 1
              fi
              if ! gh workflow run codeql.yml --repo "${REPOSITORY}" --ref "${head_ref}"; then
                echo "::error::PR #${number} CodeQL dispatch failed."
                return 1
              fi
              echo "PR #${number} updated; trusted CI and CodeQL dispatched on ${updated_sha}."
              return 0
            fi

            auto_merge="$(jq -r 'if .auto_merge == null then "false" else "true" end' <<<"${pr}")"
            [[ "${auto_merge}" == "false" ]] || return 0

            repo_json="$(gh api "repos/${REPOSITORY}")"
            if [[ "$(jq -r '.allow_squash_merge' <<<"${repo_json}")" == "true" ]]; then
              method="--squash"
            elif [[ "$(jq -r '.allow_rebase_merge' <<<"${repo_json}")" == "true" ]]; then
              method="--rebase"
            else
              echo "::error::No repository merge method is enabled."
              return 1
            fi

            gh pr merge --auto "${method}" --match-head-commit "${head_sha}" "${url}"
          }

          failures=0
          while IFS= read -r number; do
            [[ -z "${number}" ]] || reconcile_pr "${number}" || failures=$((failures + 1))
          done < <(
            gh api --paginate "repos/${REPOSITORY}/pulls?state=open&base=${default_branch}&per_page=100" \
              --jq '.[] | select(.user.login == "dependabot[bot]" or .user.login == "copilot-swe-agent[bot]") | .number'
          )
          [[ "${failures}" -eq 0 ]] || exit 1
