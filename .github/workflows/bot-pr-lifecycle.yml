name: Bot PR lifecycle

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: bot-pr-lifecycle
  cancel-in-progress: false

jobs:
  reconcile:
    name: Update and auto-merge trusted bot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Reconcile Dependabot and Copilot pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          default_branch="$(gh api "repos/${REPOSITORY}" --jq '.default_branch')"

          owner="${REPOSITORY%%/*}"
          repo_name="${REPOSITORY#*/}"

          log() {
            printf '[bot-pr-lifecycle] %s\n' "$*"
          }

          review_gate() {
            local number="$1"
            local review_json unresolved changes_requested review_decision
            # GraphQL variables must remain literal inside the query string.
            # shellcheck disable=SC2016
            review_json="$(gh api graphql \
              -F owner="$owner" \
              -F name="$repo_name" \
              -F number="$number" \
              -f query='
                query($owner:String!, $name:String!, $number:Int!) {
                  repository(owner:$owner, name:$name) {
                    pullRequest(number:$number) {
                      reviewDecision
                      reviewThreads(first:100) {
                        nodes { isResolved }
                        pageInfo { hasNextPage }
                      }
                      reviews(first:100) {
                        nodes { author { login } state submittedAt }
                        pageInfo { hasNextPage }
                      }
                    }
                  }
                }'
            )"

            if [[ "$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"$review_json")" == "true" ||
                  "$(jq -r '.data.repository.pullRequest.reviews.pageInfo.hasNextPage' <<<"$review_json")" == "true" ]]; then
              log "PR #$number has more than 100 review items; leaving it for manual review."
              return 1
            fi

            unresolved="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$review_json")"
            changes_requested="$(jq '
              [.data.repository.pullRequest.reviews.nodes[] | select(.author.login != null)]
              | group_by(.author.login)
              | map(sort_by(.submittedAt) | last)
              | map(select(.state == "CHANGES_REQUESTED"))
              | length
            ' <<<"$review_json")"
            review_decision="$(jq -r '.data.repository.pullRequest.reviewDecision // ""' <<<"$review_json")"

            (( unresolved == 0 )) || { log "PR #$number has unresolved review threads."; return 1; }
            (( changes_requested == 0 )) || { log "PR #$number has an active changes-requested review."; return 1; }
            [[ "$review_decision" == "APPROVED" ]] || { log "PR #$number has no current, valid approving review."; return 1; }
          }

          reconcile_pr() {
            local number="$1"
            local pr author draft state base_ref head_repo head_ref head_sha mergeable_state
            local method url auto_merge repo_json updated_sha

            pr="$(gh api "repos/${REPOSITORY}/pulls/${number}")"
            author="$(jq -r '.user.login' <<<"${pr}")"
            # GitHub-provided author type, never branch prefix or claimed name.
            [[ "$(jq -r '.user.type // ""' <<<"${pr}")" == "Bot" ]] || return 0

            state="$(jq -r '.state' <<<"${pr}")"
            draft="$(jq -r '.draft' <<<"${pr}")"
            base_ref="$(jq -r '.base.ref' <<<"${pr}")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"${pr}")"
            head_ref="$(jq -r '.head.ref' <<<"${pr}")"
            head_sha="$(jq -r '.head.sha' <<<"${pr}")"
            url="$(jq -r '.html_url' <<<"${pr}")"
            [[ "${state}" == "open" && "${draft}" == "false" ]] || return 0
            [[ "${base_ref}" == "${default_branch}" && "${head_repo}" == "${REPOSITORY}" ]] || return 0

            mergeable_state="$(jq -r '.mergeable_state // "unknown"' <<<"${pr}")"
            if [[ "${mergeable_state}" == "dirty" ]]; then
              echo "PR #${number} has conflicts; manual resolution required."
              return 0
            fi

            if [[ "${mergeable_state}" == "behind" ]]; then
              # GITHUB_TOKEN update-branch suppresses PR checks. Never dispatch
              # a mutable bot-controlled workflow revision to compensate.
              echo "::warning::PR #${number} is behind ${default_branch}; a trusted PR update is needed before auto-merge."
              return 0
            fi

            # Do not queue bot code while findings or approval requirements
            # remain unresolved. GitHub's native ruleset remains authoritative.
            if ! review_gate "${number}"; then
              echo "::notice::PR #${number} review gate is not ready; auto-merge was not enabled."
              return 0
            fi
            # Only act after a real GitHub APPROVED review decision.
            auto_merge="$(jq -r 'if .auto_merge == null then "false" else "true" end' <<<"${pr}")"
            [[ "${auto_merge}" == "false" ]] || return 0

            repo_json="$(gh api "repos/${REPOSITORY}")"
            if [[ "$(jq -r '.allow_squash_merge' <<<"${repo_json}")" == "true" ]]; then
              method="--squash"
            elif [[ "$(jq -r '.allow_rebase_merge' <<<"${repo_json}")" == "true" ]]; then
              method="--rebase"
            else
              echo "::error::No repository merge method is enabled."
              return 1
            fi

            gh pr merge --auto "${method}" "${url}"
          }

          failures=0
          while IFS= read -r number; do
            [[ -z "${number}" ]] || reconcile_pr "${number}" || failures=$((failures + 1))
          done < <(
            gh api --paginate "repos/${REPOSITORY}/pulls?state=open&base=${default_branch}&per_page=100" \
              --jq '.[] | select(.user.type == "Bot") | .number'
          )
          [[ "${failures}" -eq 0 ]] || exit 1
