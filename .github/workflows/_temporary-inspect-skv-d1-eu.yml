name: Temporary migrate Skvallerbyttan D1 to EU

on:
  push:
    branches:
      - chatgpt/d1-eu-migrate/2026-09-25/07-35-skv

permissions:
  contents: read

concurrency:
  group: d1-eu-skvallerbyttan
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_W1 }}
      CLOUDFLARE_ACCOUNT_ID: b74f8c0c6a92f3006483840cf27372fd
      SOURCE_DB_ID: 12b0199f-efa2-4f96-b5c5-e3a7f2144125
      SOURCE_DB_NAME: skvallerbyttan-stats
      TARGET_DB_ID: 5e30b2a0-e47f-43f9-95cd-fc59fb542073
      TARGET_DB_NAME: skvallerbyttan-stats-eu
      EXPECTED_MAIN_SHA: b1e3fbf0d5f6655de77245637965f556b70eb829
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b1e3fbf0d5f6655de77245637965f556b70eb829
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Preflight and freeze source writes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]]
          node <<'NODE'
          import fs from "node:fs";
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          const source=process.env.SOURCE_DB_ID, target=process.env.TARGET_DB_ID;
          const base=`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database`;
          const headers={Authorization:`Bearer ${token}`,"Content-Type":"application/json"};
          async function get(id){const r=await fetch(`${base}/${id}`,{headers});const b=await r.json();if(!r.ok||!b.success)throw new Error(`get failed ${r.status}`);return b.result;}
          async function q(id,body){const r=await fetch(`${base}/${id}/query`,{method:"POST",headers,body:JSON.stringify(body)});const b=await r.json();if(!r.ok||!b.success||b.result?.some?.(x=>x.success===false))throw new Error(`query failed ${r.status}`);return b.result;}
          const [s,t]=await Promise.all([get(source),get(target)]);
          if(s.name!==process.env.SOURCE_DB_NAME) throw new Error("source identity mismatch");
          if(t.name!==process.env.TARGET_DB_NAME||t.jurisdiction!=="eu"||t.read_replication?.mode!=="disabled") throw new Error("target metadata mismatch");
          const targetTables=(await q(target,{sql:"SELECT name FROM sqlite_schema WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name"}))[0].results;
          if(targetTables.length) throw new Error("EU target is not empty");
          const tables=(await q(source,{sql:"SELECT name FROM sqlite_schema WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name"}))[0].results.map(x=>x.name);
          const qi=s=>'"'+String(s).replaceAll('"','""')+'"';
          const counts={};
          for(const table of tables) counts[table]=Number((await q(source,{sql:`SELECT COUNT(*) AS n FROM ${qi(table)}`}))[0].results[0].n);
          fs.writeFileSync("/tmp/source-counts.json",JSON.stringify(counts));
          const batch=[];
          tables.forEach((table,i)=>{
            const suffix=String(i).padStart(3,"0");
            for(const [op,event] of [["i","INSERT"],["u","UPDATE"],["d","DELETE"]]){
              batch.push({sql:`CREATE TRIGGER IF NOT EXISTS ${qi(`__eu_freeze_${suffix}_${op}`)} BEFORE ${event} ON ${qi(table)} BEGIN SELECT RAISE(ABORT, 'EU D1 migration in progress'); END`});
            }
          });
          await q(source,{batch});
          const frozen=Number((await q(source,{sql:"SELECT COUNT(*) AS n FROM sqlite_schema WHERE type='trigger' AND name LIKE '__eu_freeze_%'"}))[0].results[0].n);
          if(frozen!==tables.length*3) throw new Error("freeze trigger count mismatch");
          console.log("Source frozen with row counts:",JSON.stringify(counts));
          NODE

      - name: Export frozen source
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.1 d1 export "$SOURCE_DB_NAME" --remote --output=/tmp/skv.sql --skip-confirmation
          test -s /tmp/skv.sql
          echo "Export bytes: $(wc -c </tmp/skv.sql)"

      - name: Import into EU target
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.1 d1 execute "$TARGET_DB_NAME" --remote --file=/tmp/skv.sql --yes

      - name: Verify exact row counts and unfreeze EU target
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from "node:fs";
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN, target=process.env.TARGET_DB_ID;
          const expected=JSON.parse(fs.readFileSync("/tmp/source-counts.json","utf8"));
          const base=`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database`;
          const headers={Authorization:`Bearer ${token}`,"Content-Type":"application/json"};
          async function q(body){const r=await fetch(`${base}/${target}/query`,{method:"POST",headers,body:JSON.stringify(body)});const b=await r.json();if(!r.ok||!b.success||b.result?.some?.(x=>x.success===false))throw new Error(`query failed ${r.status}`);return b.result;}
          const qi=s=>'"'+String(s).replaceAll('"','""')+'"';
          const actual={};
          for(const table of Object.keys(expected)) actual[table]=Number((await q({sql:`SELECT COUNT(*) AS n FROM ${qi(table)}`}))[0].results[0].n);
          if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error(`row count mismatch expected=${JSON.stringify(expected)} actual=${JSON.stringify(actual)}`);
          const triggers=(await q({sql:"SELECT name FROM sqlite_schema WHERE type='trigger' AND name LIKE '__eu_freeze_%' ORDER BY name"}))[0].results.map(x=>x.name);
          if(triggers.length) await q({batch:triggers.map(name=>({sql:`DROP TRIGGER ${qi(name)}`}))});
          const remaining=Number((await q({sql:"SELECT COUNT(*) AS n FROM sqlite_schema WHERE type='trigger' AND name LIKE '__eu_freeze_%'"}))[0].results[0].n);
          if(remaining!==0) throw new Error("EU target still frozen");
          console.log("Imported row counts verified:",JSON.stringify(actual));
          NODE

      - name: Install and verify Skvallerbyttan
        working-directory: apps/skvallerbyttan
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Deploy Skvallerbyttan with EU D1 binding
        working-directory: apps/skvallerbyttan
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply STATS_DB --remote
          npm run deploy
          touch /tmp/eu-deployed

      - name: Verify production contract and EU D1
        working-directory: apps/skvallerbyttan
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:production
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN, id=process.env.TARGET_DB_ID;
          const base=`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database`;
          const headers={Authorization:`Bearer ${token}`,"Content-Type":"application/json"};
          const info=await (await fetch(`${base}/${id}`,{headers})).json();
          if(!info.success||info.result.jurisdiction!=="eu"||info.result.read_replication?.mode!=="disabled") throw new Error("EU target metadata mismatch");
          const r=await fetch(`${base}/${id}/query`,{method:"POST",headers,body:JSON.stringify({sql:"SELECT COUNT(*) AS n FROM observation_events"})});
          const b=await r.json();
          if(!r.ok||!b.success||Number(b.result?.[0]?.results?.[0]?.n)<15000) throw new Error("EU target observation data verification failed");
          console.log(JSON.stringify({name:info.result.name,jurisdiction:info.result.jurisdiction,read_replication:info.result.read_replication?.mode,file_size:info.result.file_size,observation_events:b.result[0].results[0].n}));
          NODE

      - name: Restore source writes on failure
        if: failure()
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN, id=process.env.SOURCE_DB_ID;
          const base=`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${id}/query`;
          const headers={Authorization:`Bearer ${token}`,"Content-Type":"application/json"};
          const q=async body=>{const r=await fetch(base,{method:"POST",headers,body:JSON.stringify(body)});if(!r.ok)return null;return r.json();};
          const found=await q({sql:"SELECT name FROM sqlite_schema WHERE type='trigger' AND name LIKE '__eu_freeze_%' ORDER BY name"});
          const names=found?.result?.[0]?.results?.map?.(x=>x.name)||[];
          const qi=s=>'"'+String(s).replaceAll('"','""')+'"';
          if(names.length) await q({batch:names.map(name=>({sql:`DROP TRIGGER ${qi(name)}`}))});
          console.log("Best-effort source unfreeze:",names.length);
          NODE
