name: Temporary finalize Skvallerbyttan EU D1 cutover

on:
  push:
    branches:
      - chatgpt/d1-eu-migrate/2026-09-25/07-35-skv

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_W1 }}
      CLOUDFLARE_ACCOUNT_ID: b74f8c0c6a92f3006483840cf27372fd
      SOURCE_DB_ID: 12b0199f-efa2-4f96-b5c5-e3a7f2144125
      TARGET_DB_ID: 5e30b2a0-e47f-43f9-95cd-fc59fb542073
      EXPECTED_WORKER_VERSION: e73bdb02-113f-4a60-bbb7-9c1ea5d39647
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Reverify Worker and EU D1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.1 deployments list --name skvallerbyttan >/tmp/deployments.txt
          grep -q "$EXPECTED_WORKER_VERSION" /tmp/deployments.txt
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN, id=process.env.TARGET_DB_ID;
          const base=`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database`;
          const headers={Authorization:`Bearer ${token}`,"Content-Type":"application/json"};
          const info=await (await fetch(`${base}/${id}`,{headers})).json();
          if(!info.success||info.result.name!=="skvallerbyttan-stats-eu"||info.result.jurisdiction!=="eu"||info.result.read_replication?.mode!=="disabled") throw new Error("EU target metadata mismatch");
          const r=await fetch(`${base}/${id}/query`,{method:"POST",headers,body:JSON.stringify({sql:"SELECT COUNT(*) AS observations FROM observation_events; SELECT COUNT(*) AS deliveries FROM webhook_deliveries;"})});
          const b=await r.json();
          if(!r.ok||!b.success||b.result?.some?.(x=>x.success===false)) throw new Error("EU target data query failed");
          const observations=Number(b.result[0].results[0].observations);
          const deliveries=Number(b.result[1].results[0].deliveries);
          if(observations<15230||deliveries<24040) throw new Error("EU target data unexpectedly regressed");
          console.log(JSON.stringify({name:info.result.name,jurisdiction:info.result.jurisdiction,observations,deliveries}));
          NODE
      - name: Delete retired non-EU Skvallerbyttan D1
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$SOURCE_DB_ID")"
          echo "old Skvallerbyttan D1 delete HTTP status: $code"
          [[ "$code" =~ ^2 ]] || { cat /tmp/delete.json; exit 1; }
      - name: Final inventory verification
        shell: bash
        run: |
          set -euo pipefail
          list="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100")"
          printf '%s' "$list" | jq -e --arg old "$SOURCE_DB_ID" --arg eu "$TARGET_DB_ID" '
            (.result | any(.uuid==$old) | not) and
            (.result | any(.uuid==$eu and .name=="skvallerbyttan-stats-eu" and .jurisdiction=="eu"))
          ' >/dev/null
          echo "Skvallerbyttan EU D1 cutover finalized"
