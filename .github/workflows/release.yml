name: Release

on:
  repository_dispatch:
    types: [agent-pr-merged]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/copilot-release-notes.yml"
      - ".github/release-notes-instructions.md"
      - ".github/scripts/semantic_release.py"
      - ".github/scripts/publish_release.py"
      - ".github/scripts/test_publish_release.py"
      - ".github/scripts/wait_for_checks.py"
      - ".github/scripts/test_wait_for_checks.py"
      - ".github/release-baseline"
      - ".github/release-required-checks"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: SemVer bump override
        required: true
        default: auto
        type: choice
        options: [auto, patch, minor, major, promote]
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [stable, rc]

permissions:
  contents: read

jobs:
  validate:
    name: Validate semantic release
    if: ${{ github.event_name == 'pull_request' }}
    concurrency:
      group: ${{ format('release-validate-{0}', github.ref) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/release-required-checks
          test -s .github/workflows/copilot-release-notes.yml
          test -s .github/release-notes-instructions.md
          python3 -m py_compile \
            .github/scripts/semantic_release.py \
            .github/scripts/publish_release.py \
            .github/scripts/test_publish_release.py \
            .github/scripts/wait_for_checks.py \
            .github/scripts/test_wait_for_checks.py
          python3 .github/scripts/test_publish_release.py
          python3 .github/scripts/test_wait_for_checks.py
          python3 .github/scripts/semantic_release.py \
            --forced-bump auto \
            --channel stable \
            --notes "${RUNNER_TEMP}/release-notes.md"

  release:
    name: Semantic release
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      checks: read
      contents: write
      statuses: read
    steps:
      - name: Wait for release turn
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          own_id = int(os.environ["GITHUB_RUN_ID"])
          token = os.environ["GITHUB_TOKEN"]
          started = time.monotonic()

          def api(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "repository-release-lock",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          while True:
              if time.monotonic() - started > 1800:
                  raise SystemExit("Timed out waiting for an earlier release run.")
              data = api("/actions/workflows/release.yml/runs?per_page=100")
              active = sorted(
                  int(run["id"])
                  for run in data.get("workflow_runs", [])
                  if run.get("event") in {"push", "workflow_dispatch", "repository_dispatch"}
                  and run.get("status") in {"queued", "in_progress"}
                  and run.get("head_branch") == "main"
              )
              if own_id not in active or own_id == active[0]:
                  print("Release turn acquired.")
                  break
              print(f"Waiting for earlier release run {active[0]}.")
              time.sleep(10)
          PY

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate version and changelog
        id: release
        shell: bash
        env:
          FORCED_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || 'auto' }}
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'stable' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/semantic_release.py \
            --forced-bump "${FORCED_BUMP}" \
            --channel "${CHANNEL}" \
            --notes "${RUNNER_TEMP}/release-notes.md" \
            --output "${GITHUB_OUTPUT}"
      - name: Verify existing release anchors
        if: ${{ steps.release.outputs.release == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_TAG: ${{ steps.release.outputs.base_tag }}
          ACTIVE_PRERELEASE_TAG: ${{ steps.release.outputs.active_prerelease_tag }}
        run: |
          set -euo pipefail
          for tag in "${BASE_TAG}" "${ACTIVE_PRERELEASE_TAG}"; do
            if [[ -n "${tag}" ]] && ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "::error::Tag ${tag} exists without a GitHub Release; reconcile it before advancing the release line."
              exit 1
            fi
          done

      - name: Wait for repository checks
        if: ${{ steps.release.outputs.release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/wait_for_checks.py \
            --repository "${GITHUB_REPOSITORY}" \
            --sha "${TARGET_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --required-checks-file ".github/release-required-checks"

      - name: Create GitHub release
        id: publish
        if: ${{ steps.release.outputs.release == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          BUMP: ${{ steps.release.outputs.bump }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          python3 .github/scripts/publish_release.py \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${TAG}" \
            --target-sha "${TARGET_SHA}" \
            --notes "${RUNNER_TEMP}/release-notes.md" \
            --bump "${BUMP}" \
            --prerelease "${PRERELEASE}" \
            --output "${GITHUB_OUTPUT}"

      - name: Prepare Copilot release metadata
        continue-on-error: true
        if: ${{ steps.release.outputs.release == 'true' }}
        shell: bash
        env:
          BASE_TAG: ${{ steps.release.outputs.base_tag }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_TAG}" ]]; then
            base_ref="${BASE_TAG}"
          else
            base_ref="$(tr -d '[:space:]' < .github/release-baseline)"
          fi
          test -n "${base_ref}"
          test -n "${TARGET_SHA}"
          mkdir -p "${RUNNER_TEMP}/copilot-release-inputs"
          {
            printf 'BASE_REF=%s\n' "${base_ref}"
            printf 'HEAD_REF=%s\n' "${TARGET_SHA}"
          } > "${RUNNER_TEMP}/copilot-release-inputs/release.env"

      - name: Upload Copilot release metadata
        continue-on-error: true
        if: ${{ steps.release.outputs.release == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copilot-release-inputs
          path: ${{ runner.temp }}/copilot-release-inputs/release.env
          if-no-files-found: error
          retention-days: 1
