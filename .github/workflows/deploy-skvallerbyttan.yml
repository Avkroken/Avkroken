name: Deploy Skvallerbyttan production

on:
  workflow_dispatch:
    inputs:
      apply_d1_migrations:
        description: Apply all pending versioned D1 migrations before deploy
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: skvallerbyttan-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/skvallerbyttan
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_W1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Validate deployment ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Production deployment must be dispatched from main."; exit 1; }
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate production credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::Required organization secret is not configured: CLOUDFLARE_API_TOKEN_W1"; exit 1; }
      - name: Verify application
        run: npm run check
      - name: Apply pending D1 migrations
        if: ${{ inputs.apply_d1_migrations }}
        run: npx wrangler d1 migrations apply STATS_DB --remote
      - name: Deploy Worker
        run: npm run deploy
      - name: Verify production
        run: npm run verify:production
