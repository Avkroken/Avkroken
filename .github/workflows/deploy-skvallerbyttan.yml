name: Deploy production

on:
  workflow_dispatch:
    inputs:
      apply_d1_migrations:
        description: Apply all pending versioned D1 migrations before deploy
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: skvallerbyttan-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_W1 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate deployment ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production deployment must be dispatched from main, got $GITHUB_REF"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate production credentials
        shell: bash
        run: |
          set -euo pipefail

          required=(
            CLOUDFLARE_API_TOKEN
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required organization secret is not configured: ${name}"
              exit 1
            fi
          done

      - name: Verify repository before production mutation
        run: npm run check

      - name: Apply pending D1 migrations
        if: ${{ inputs.apply_d1_migrations }}
        run: npx wrangler d1 migrations apply STATS_DB --remote

      - name: Deploy Worker
        run: npm run deploy

      - name: Verify push monitoring deployment contract
        run: npm run verify:production
