name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate Conventional Commit title
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys

          pattern = re.compile(
              r"^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)"
              r"(\([^)]+\))?!?: [^\s].*$"
          )

          valid = (
              "feat: add repository documentation portal",
              "fix(portal): preserve mirrored Wiki links",
              "perf!: replace cache contract",
              "docs: clarify authentication model",
              "build(deps): bump runtime dependencies",
              "build(deps-dev): bump development dependencies",
              "chore(deps): update development dependencies",
              "ci: harden release workflow",
              "refactor(api): isolate source adapters",
              "revert: restore previous routing behavior",
          )
          invalid = (
              "Add repository documentation portal",
              "feature: add repository documentation portal",
              "feat add repository documentation portal",
              "feat:",
              "Feat: add repository documentation portal",
              "Build(deps-dev): bump development dependencies",
          )

          for fixture in valid:
              if not pattern.fullmatch(fixture):
                  print(f"::error::validator rejected valid fixture: {fixture}")
                  sys.exit(1)

          for fixture in invalid:
              if pattern.fullmatch(fixture):
                  print(f"::error::validator accepted invalid fixture: {fixture}")
                  sys.exit(1)

          title = os.environ.get("PR_TITLE", "").strip()
          if pattern.fullmatch(title):
              print(f"PR title follows Conventional Commits: {title}")
              sys.exit(0)

          print("::error title=Invalid PR title::Use Conventional Commits, for example: "
                "feat: add portal search, fix(auth): preserve session, "
                "or feat!: change public API contract.")
          print(f"Received: {title!r}")
          sys.exit(1)
          PY
