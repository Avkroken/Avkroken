name: CI

on:
  repository_dispatch:
    types: [agent-pr-merged]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          base-ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          head-ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300

  portal:
    name: Portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Verify sharp security floor
        run: node scripts/check-sharp-security-floor.mjs portal
      - name: Validate portal Worker
        working-directory: apps/portal
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          google-chrome --version
          chromedriver --version
          npm run test:browser
          npx wrangler deploy --dry-run --config wrangler.jsonc

  skvallerbyttan:
    name: Skvallerbyttan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Verify sharp security floor
        run: node scripts/check-sharp-security-floor.mjs skvallerbyttan
      - name: Validate Skvallerbyttan
        working-directory: apps/skvallerbyttan
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

  ingest:
    name: Ingest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Install shared TypeScript test toolchain
        working-directory: apps/skvallerbyttan
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate deploy-neutral Ingest seam
        run: |
          apps/skvallerbyttan/node_modules/.bin/tsx --test apps/ingest/test/*.test.ts
          apps/skvallerbyttan/node_modules/.bin/tsc --noEmit -p apps/ingest/tsconfig.json

  events:
    name: Events
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Install shared TypeScript test toolchain
        working-directory: apps/skvallerbyttan
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate deploy-neutral Events seam
        run: |
          apps/skvallerbyttan/node_modules/.bin/tsx --test apps/events/test/*.test.ts
          apps/skvallerbyttan/node_modules/.bin/tsc --noEmit -p apps/events/tsconfig.json

  krosa-maja:
    name: Krosa-Maja
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Krosa-Maja retirement
        shell: bash
        run: |
          set -euo pipefail
          test ! -e apps/krosa-maja
          test ! -e .github/workflows/deploy-krosa-maja.yml
          if grep -R -n -E 'KROSA_MAJA_OIDC|KROSA_MAJA_GITHUB_CLIENT_ID|auth\.denied\.se|oidc-auth|apps/krosa-maja' apps README.md docs .github/labeler.yml; then
            echo "::error::Retired Krosa-Maja auth/runtime reference remains."
            exit 1
          fi
          if grep -R -n -E '"binding"[[:space:]]*:[[:space:]]*"KROSA_MAJA_CLIENT_SECRET"' apps; then
            echo "::error::Legacy Krosa-Maja client-secret binding remains."
            exit 1
          fi

  jobb:
    name: Jobb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Verify sharp security floor
        run: node scripts/check-sharp-security-floor.mjs jobb
      - name: Validate Jobb
        working-directory: apps/jobb
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm --filter @avkroken/web exec wrangler deploy --dry-run --config ../../wrangler.jsonc

  dumpen:
    name: Dumpen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Verify sharp security floor
        run: node scripts/check-sharp-security-floor.mjs dumpen
      - name: Validate Dumpen
        working-directory: apps/dumpen
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

  spam-filter:
    name: Spam filter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Verify sharp security floor
        run: node scripts/check-sharp-security-floor.mjs spam-filter
      - name: Validate spam filter Worker
        working-directory: apps/spam-filter
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
