name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  portal:
    name: Portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Validate portal Worker
        working-directory: apps/portal
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npx wrangler deploy --dry-run --config wrangler.jsonc

  skvallerbyttan:
    name: Skvallerbyttan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Validate Skvallerbyttan
        working-directory: apps/skvallerbyttan
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

  krosa-maja:
    name: Krosa-Maja
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Krosa-Maja retirement
        shell: bash
        run: |
          set -euo pipefail
          test ! -e apps/krosa-maja
          test ! -e .github/workflows/deploy-krosa-maja.yml
          if grep -R -n -E 'KROSA_MAJA_OIDC|KROSA_MAJA_GITHUB_CLIENT_ID|auth\.denied\.se|oidc-auth|apps/krosa-maja' apps .github README.md docs; then
            echo "::error::Retired Krosa-Maja auth/runtime reference remains."
            exit 1
          fi
          if grep -R -n -E '"binding"[[:space:]]*:[[:space:]]*"KROSA_MAJA_CLIENT_SECRET"' apps; then
            echo "::error::Legacy Krosa-Maja client-secret binding remains."
            exit 1
          fi

  jobb:
    name: Jobb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Validate Jobb
        working-directory: apps/jobb
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm --filter @avkroken/web exec wrangler deploy --dry-run --config ../../wrangler.jsonc
