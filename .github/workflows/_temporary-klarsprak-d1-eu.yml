name: Temporary compare Klarsprak D1 content hashes

on:
  push:
    branches:
      - chatgpt/d1-eu-migrate/2026-09-25/07-40-klarsprak

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_W1 }}
      CLOUDFLARE_ACCOUNT_ID: b74f8c0c6a92f3006483840cf27372fd
      SOURCE_DB_ID: a8117d9d-a65d-430d-a8a2-9b4ef3fd9e2f
      TARGET_DB_ID: 7891c6c7-0d4b-4e23-b2d8-d3eaaabdcfce
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Compare non-sensitive table hashes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import crypto from "node:crypto";
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          const ids={source:process.env.SOURCE_DB_ID,target:process.env.TARGET_DB_ID};
          const base=`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database`;
          const headers={Authorization:`Bearer ${token}`,"Content-Type":"application/json"};
          async function q(id,sql){
            const r=await fetch(`${base}/${id}/query`,{method:"POST",headers,body:JSON.stringify({sql})});
            const b=await r.json();
            if(!r.ok||!b.success||b.result?.some?.(x=>x.success===false)) throw new Error(`query failed ${r.status}`);
            return b.result[0].results;
          }
          function canonical(value){
            if(Array.isArray(value)) return value.map(canonical);
            if(value&&typeof value==="object") return Object.fromEntries(Object.keys(value).sort().map(k=>[k,canonical(value[k])]));
            return value;
          }
          const digest=rows=>crypto.createHash("sha256").update(JSON.stringify(rows.map(canonical).map(JSON.stringify).sort())).digest("hex");
          for(const table of ["d1_migrations","published_terms","submissions"]){
            const out={table};
            for(const [label,id] of Object.entries(ids)){
              const rows=await q(id,`SELECT * FROM "${table}"`);
              out[label]={count:rows.length,sha256:digest(rows)};
            }
            console.log(JSON.stringify(out));
          }
          NODE
