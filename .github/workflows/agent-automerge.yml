name: Agent auto-merge

on:
  workflow_run:
    workflows: ["Agent lifecycle signal"]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  agent-auto-merge:
    permissions:
      checks: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/agent-automerge-policy.yml
