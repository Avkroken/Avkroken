name: Agent PR lifecycle policy

on:
  workflow_call:

concurrency:
  group: agent-pr-lifecycle-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile trusted agent PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update and enable native auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          owner="${REPOSITORY%%/*}"
          repo_name="${REPOSITORY#*/}"
          default_branch="$(gh api "repos/${REPOSITORY}" --jq '.default_branch')"

          log() {
            printf '[agent-pr-lifecycle] %s\n' "$*"
          }

          review_gate() {
            local number="$1" head_sha="$2" review_json
            # Called in a conditional: explicitly handle failures instead of
            # relying on errexit, which Bash disables in this context.
            # shellcheck disable=SC2016
            if ! review_json="$(gh api graphql \
              -F owner="${REPOSITORY%%/*}" -F name="${REPOSITORY#*/}" -F number="$number" \
              -f query='
                query($owner:String!, $name:String!, $number:Int!) {
                  repository(owner:$owner, name:$name) {
                    pullRequest(number:$number) {
                      headRefOid
                      reviewDecision
                      reviewThreads(first:100) {
                        nodes { isResolved }
                        pageInfo { hasNextPage }
                      }
                      reviews(first:100) {
                        nodes { author { login } state submittedAt commit { oid } }
                        pageInfo { hasNextPage }
                      }
                    }
                  }
                }')"; then
              log "PR #${number} review state could not be read."
              log "PR #${number} retry on the next lifecycle event or scheduled reconciliation; preserving auto-merge consent."
              return 2
            fi

            # Exit 2 means unknown, not a negative review. Never mutate consent
            # from API errors, partial pages, malformed data or a racing push.
            if ! jq -e --arg sha "$head_sha" '
              ((.errors // []) | length == 0) and
              (.data.repository.pullRequest |
                .headRefOid == $sha and
                has("reviewDecision") and
                (.reviewDecision == null or .reviewDecision == "APPROVED" or
                 .reviewDecision == "REVIEW_REQUIRED" or .reviewDecision == "CHANGES_REQUESTED") and
                .reviewThreads.pageInfo.hasNextPage == false and
                .reviews.pageInfo.hasNextPage == false and
                (.reviewThreads.nodes | type == "array") and
                (.reviews.nodes | type == "array") and
                all(.reviewThreads.nodes[]; (.isResolved | type == "boolean")) and
                all(.reviews.nodes[];
                  (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or
                   .state == "DISMISSED" or .state == "COMMENTED" or .state == "PENDING")) and
                ([.reviews.nodes[] |
                  select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")]
                  | all(.[]; (.author.login | type == "string") and (.submittedAt | type == "string"))))
            ' <<<"$review_json" >/dev/null; then
              log "PR #${number} review state is incomplete or stale; retry on the next lifecycle event or scheduled reconciliation, preserving auto-merge consent."
              return 2
            fi

            # Include every thread, including outdated threads. Incomplete or
            # paginated responses above cannot establish a review decision.
            # Comments and pending reviews do not supersede a submitted decision.
            if ! jq -e --arg sha "$head_sha" '
              ((.errors // []) | length == 0) and
              (.data.repository.pullRequest |
                .headRefOid == $sha and
                has("reviewDecision") and
                (.reviewDecision == "APPROVED") and
                .reviewThreads.pageInfo.hasNextPage == false and
                .reviews.pageInfo.hasNextPage == false and
                (.reviewThreads.nodes | type == "array") and
                (.reviews.nodes | type == "array") and
                all(.reviewThreads.nodes[]; .isResolved == true) and
                ([.reviews.nodes[] | select(.state == "APPROVED" or
                                            .state == "CHANGES_REQUESTED" or
                                            .state == "DISMISSED")] |
                  group_by(.author.login) |
                  any(.[]; (sort_by(.submittedAt) | last |
                    .state == "APPROVED" and (.commit.oid // "") == $sha))) and
                all(.reviews.nodes[];
                  (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or
                   .state == "DISMISSED" or .state == "COMMENTED" or .state == "PENDING")) and
                ([.reviews.nodes[] |
                  select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")]
                  | all(.[]; (.author.login | type == "string") and (.submittedAt | type == "string")) and
                  (group_by(.author.login)
                    | all(.[]; (sort_by(.submittedAt) | last | .state) != "CHANGES_REQUESTED"))))
            ' <<<"$review_json" >/dev/null; then
              log "PR #${number} has pending review work."
              return 1
            fi
          }

          disable_auto_merge() {
            local number="$1" head_sha="$2" url="$3"
            log "PR #$number review gate is closed; disabling queued auto-merge."
            gh pr merge --disable-auto --match-head-commit "$head_sha" "$url"
          }

          reconcile_pr() {
            local number="$1"
            local pr_json state author author_type permission_json permission head_repo base_ref draft
            local head_sha mergeable mergeable_state new_sha repo_json method pr_url review_status

            pr_json="$(gh api "repos/${REPOSITORY}/pulls/$number")"
            state="$(jq -r '.state' <<<"$pr_json")"
            author="$(jq -r '.user.login // ""' <<<"$pr_json")"
            author_type="$(jq -r '.user.type // ""' <<<"$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
            draft="$(jq -r '.draft' <<<"$pr_json")"
            pr_url="$(jq -r '.html_url' <<<"$pr_json")"
            head_sha="$(jq -r '.head.sha // ""' <<<"$pr_json")"

            # Only automate ready same-repository PRs targeting the default branch.
            # Anyone with read access can propose a fork PR; such PRs remain manual.
            if [[ "$state" != "open" ||
                  "$head_repo" != "$REPOSITORY" ||
                  "$base_ref" != "$default_branch" ||
                  "$draft" == "true" ]]; then
              return 0
            fi
            # The human or authorized automation must explicitly place this
            # PR in native GitHub auto-merge. Permission alone is not consent.
            # Never queue arbitrary collaborator PRs from this privileged job.
            if [[ "$(jq -r '.auto_merge == null' <<<"$pr_json")" == "true" ]]; then
              log "PR #$number was not queued for native auto-merge; skipping."
              return 0
            fi

            # Native auto-merge queue membership is explicit authorization.
            # Verify human collaborators' current GitHub write permission;
            # bot principals are provider-resolved, not inferred from a fixed
            # vendor login allowlist or a mutable branch prefix.
            case "$author_type" in
              User)
                permission_json="$(gh api "repos/${REPOSITORY}/collaborators/${author}/permission" 2>/dev/null)" || {
                  log "Cannot verify PR #$number author permissions; skipping."
                  return 0
                }
                permission="$(jq -r '.permission // "none"' <<<"$permission_json")"
                case "$permission" in
                  write|maintain|admin) ;;
                  *)
                    log "PR #$number author lacks write permission; skipping."
                    return 0
                    ;;
                esac
                # The explicit native queue request establishes consent.
                # GitHub authorizes the person/app who enabled auto-merge.
                ;;
              Bot)
                # All installed GitHub App/bot authors use the dedicated bot
                # lifecycle, regardless of provider name or branch prefix.
                # Keeping a single reconciler prevents overlapping changes.
                log "PR #$number Bot PR is handled by the separate bot lifecycle."
                return 0
                ;;
              *)
                log "PR #$number author type is not supported; skipping."
                return 0
                ;;
            esac

            if review_gate "$number" "$head_sha"; then
              :
            else
              review_status=$?
              [[ "$review_status" -eq 1 ]] || return 1
              disable_auto_merge "$number" "$head_sha" "$pr_url" || return 1
              return 0
            fi

            for _ in 1 2 3; do
              pr_json="$(gh api "repos/${REPOSITORY}/pulls/$number")"
              head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
              mergeable="$(jq -r 'if .mergeable == null then "unknown" else (.mergeable|tostring) end' <<<"$pr_json")"
              mergeable_state="$(jq -r '.mergeable_state // "unknown"' <<<"$pr_json")"

              if [[ "$mergeable_state" == "dirty" || "$mergeable" == "false" ]]; then
                log "PR #$number has a real merge conflict; leaving it unmerged."
                return 0
              fi
              if [[ "$mergeable_state" == "behind" ]]; then
                # A GITHUB_TOKEN update suppresses normal PR checks and can
                # invalidate approvals. Leave the queue pending a trusted update.
                log "PR #$number is behind $default_branch; no token-driven branch update."
                return 0
              fi
              [[ "$mergeable_state" != "unknown" && "$mergeable" != "unknown" ]] && break
              sleep 3
            done

            pr_json="$(gh api "repos/${REPOSITORY}/pulls/$number")"
            head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            mergeable_state="$(jq -r '.mergeable_state // "unknown"' <<<"$pr_json")"
            mergeable="$(jq -r 'if .mergeable == null then "unknown" else (.mergeable|tostring) end' <<<"$pr_json")"
            [[ "$mergeable_state" != "dirty" && "$mergeable" != "false" ]] || return 0
            if review_gate "$number" "$head_sha"; then
              :
            else
              review_status=$?
              [[ "$review_status" -eq 1 ]] || return 1
              disable_auto_merge "$number" "$head_sha" "$pr_url" || return 1
              return 0
            fi
            # Native GitHub rulesets and required checks own merge authorization.
            # Cloudflare Workers Builds are not required GitHub status checks.

            # Never create or restore a queue request; consent belongs to the initiator.
            if [[ "$(jq -r '.auto_merge == null' <<<"$pr_json")" == "true" ]]; then
              log "PR #$number auto-merge was withdrawn; not re-enabling."
            else
              log "PR #$number remains queued and passes the review gate."
            fi
            return 0
          }

          if [[ -n "$EVENT_PR_NUMBER" ]]; then
            candidates="$EVENT_PR_NUMBER"
          else
            if ! candidates="$(gh api --paginate "repos/${REPOSITORY}/pulls?state=open&base=${default_branch}&per_page=100" --jq '.[].number')"; then
              log "Could not list open PRs; reconciliation failed."
              exit 1
            fi
          fi

          [[ -n "$candidates" ]] || { log "No open pull requests need reconciliation."; exit 0; }
          failures=0
          while IFS= read -r number; do
            if [[ -n "$number" ]]; then
              reconcile_pr "$number" || failures=$((failures + 1))
            fi
          done <<<"$candidates"
          [[ "$failures" -eq 0 ]] || exit 1
