name: Agent PR lifecycle policy

on:
  workflow_call:

concurrency:
  group: agent-pr-lifecycle-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile trusted agent PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update and enable native auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          owner="${REPOSITORY%%/*}"
          repo_name="${REPOSITORY#*/}"
          default_branch="$(gh api "repos/${REPOSITORY}" --jq '.default_branch')"

          log() {
            printf '[agent-pr-lifecycle] %s\n' "$*"
          }

          review_gate() {
            local number="$1"
            local review_json unresolved changes_requested review_decision
            # GraphQL variables must remain literal inside the query string.
            # shellcheck disable=SC2016
            review_json="$(gh api graphql \
              -F owner="$owner" \
              -F name="$repo_name" \
              -F number="$number" \
              -f query='
                query($owner:String!, $name:String!, $number:Int!) {
                  repository(owner:$owner, name:$name) {
                    pullRequest(number:$number) {
                      reviewDecision
                      reviewThreads(first:100) {
                        nodes { isResolved }
                        pageInfo { hasNextPage }
                      }
                      reviews(first:100) {
                        nodes { author { login } state submittedAt }
                        pageInfo { hasNextPage }
                      }
                    }
                  }
                }'
            )"

            if [[ "$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"$review_json")" == "true" ||
                  "$(jq -r '.data.repository.pullRequest.reviews.pageInfo.hasNextPage' <<<"$review_json")" == "true" ]]; then
              log "PR #$number has more than 100 review items; leaving it for manual review."
              return 1
            fi

            unresolved="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$review_json")"
            changes_requested="$(jq '
              [.data.repository.pullRequest.reviews.nodes[] | select(.author.login != null)]
              | group_by(.author.login)
              | map(sort_by(.submittedAt) | last)
              | map(select(.state == "CHANGES_REQUESTED"))
              | length
            ' <<<"$review_json")"
            review_decision="$(jq -r '.data.repository.pullRequest.reviewDecision // ""' <<<"$review_json")"

            (( unresolved == 0 )) || { log "PR #$number has unresolved review threads."; return 1; }
            (( changes_requested == 0 )) || { log "PR #$number has an active changes-requested review."; return 1; }
            [[ "$review_decision" == "APPROVED" ]] || { log "PR #$number has no current, valid approving review."; return 1; }
          }

          disable_auto_merge() {
            local pr_url="$1"
            gh pr merge --disable-auto "$pr_url" >/dev/null 2>&1 || true
          }

          reconcile_pr() {
            local number="$1"
            local pr_json state author author_type permission_json permission head_repo base_ref draft
            local head_sha mergeable mergeable_state new_sha repo_json method pr_url

            pr_json="$(gh api "repos/${REPOSITORY}/pulls/$number")"
            state="$(jq -r '.state' <<<"$pr_json")"
            author="$(jq -r '.user.login // ""' <<<"$pr_json")"
            author_type="$(jq -r '.user.type // ""' <<<"$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
            draft="$(jq -r '.draft' <<<"$pr_json")"
            pr_url="$(jq -r '.html_url' <<<"$pr_json")"

            # Only automate ready same-repository PRs targeting the default branch.
            # Anyone with read access can propose a fork PR; such PRs remain manual.
            if [[ "$state" != "open" ||
                  "$head_repo" != "$REPOSITORY" ||
                  "$base_ref" != "$default_branch" ||
                  "$draft" == "true" ]]; then
              return 0
            fi
            # The human or authorized automation must explicitly place this
            # PR in native GitHub auto-merge. Permission alone is not consent.
            # Never queue arbitrary collaborator PRs from this privileged job.
            if [[ "$(jq -r '.auto_merge == null' <<<"$pr_json")" == "true" ]]; then
              log "PR #$number was not queued for native auto-merge; skipping."
              return 0
            fi

            # Native auto-merge queue membership is explicit authorization.
            # Verify human collaborators' current GitHub write permission;
            # bot principals are provider-resolved, not inferred from a fixed
            # vendor login allowlist or a mutable branch prefix.
            case "$author_type" in
              User)
                permission_json="$(gh api "repos/${REPOSITORY}/collaborators/${author}/permission" 2>/dev/null)" || {
                  log "Cannot verify PR #$number author permissions; skipping."
                  return 0
                }
                permission="$(jq -r '.permission // "none"' <<<"$permission_json")"
                case "$permission" in
                  write|maintain|admin) ;;
                  *)
                    log "PR #$number author lacks write permission; skipping."
                    return 0
                    ;;
                esac
                # A collaborator's permission is not proof of agent identity.
                # Only accept a human PR if that author explicitly queued it.
                if [[ "$(jq -r '.auto_merge.enabled_by.login // ""' <<<"$pr_json")" != "$author" ]]; then
                  log "PR #$number was not explicitly queued by its author; skipping."
                  return 0
                fi
                ;;
              Bot)
                case "$author" in
                  "dependabot[bot]"|"copilot-swe-agent[bot]"|"gamnacken[bot]") ;;
                  *)
                    log "PR #$number bot author is not allowlisted; skipping."
                    return 0
                    ;;
                esac
                ;;
              *)
                log "PR #$number author type is not supported; skipping."
                return 0
                ;;
            esac

            if ! review_gate "$number"; then
              disable_auto_merge "$pr_url"
              return 0
            fi

            for _ in 1 2 3; do
              pr_json="$(gh api "repos/${REPOSITORY}/pulls/$number")"
              head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
              mergeable="$(jq -r 'if .mergeable == null then "unknown" else (.mergeable|tostring) end' <<<"$pr_json")"
              mergeable_state="$(jq -r '.mergeable_state // "unknown"' <<<"$pr_json")"

              if [[ "$mergeable_state" == "dirty" || "$mergeable" == "false" ]]; then
                log "PR #$number has a real merge conflict; leaving it unmerged."
                return 0
              fi
              if [[ "$mergeable_state" == "behind" ]]; then
                # A GITHUB_TOKEN update suppresses normal PR checks and can
                # invalidate approvals. Leave the queue pending a trusted update.
                log "PR #$number is behind $default_branch; no token-driven branch update."
                return 0
              fi
              [[ "$mergeable_state" != "unknown" && "$mergeable" != "unknown" ]] && break
              sleep 3
            done

            pr_json="$(gh api "repos/${REPOSITORY}/pulls/$number")"
            head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            mergeable_state="$(jq -r '.mergeable_state // "unknown"' <<<"$pr_json")"
            mergeable="$(jq -r 'if .mergeable == null then "unknown" else (.mergeable|tostring) end' <<<"$pr_json")"
            [[ "$mergeable_state" != "dirty" && "$mergeable" != "false" ]] || return 0
            if ! review_gate "$number"; then
              disable_auto_merge "$pr_url"
              return 0
            fi
            # Native GitHub rulesets and required checks own merge authorization.
            # Cloudflare Workers Builds are not required GitHub status checks.

            repo_json="$(gh api "repos/${REPOSITORY}")"
            # main requires linear history; prefer the native squash strategy.
            if [[ "$(jq -r '.allow_squash_merge' <<<"$repo_json")" == "true" ]]; then
              method="--squash"
            elif [[ "$(jq -r '.allow_rebase_merge' <<<"$repo_json")" == "true" ]]; then
              method="--rebase"
            else
              log "No linear-history-compatible merge method is enabled."
              return 0
            fi

            log "Enabling native auto-merge for PR #$number."
            gh pr merge --auto "$method" "$pr_url"
          }

          if [[ -n "$EVENT_PR_NUMBER" ]]; then
            candidates="$EVENT_PR_NUMBER"
          else
            candidates="$(gh api --paginate "repos/${REPOSITORY}/pulls?state=open&base=${default_branch}&per_page=100" --jq '.[].number')"
          fi

          [[ -n "$candidates" ]] || { log "No open pull requests need reconciliation."; exit 0; }
          while read -r number; do
            [[ -n "$number" ]] && reconcile_pr "$number"
          done <<<"$candidates"
