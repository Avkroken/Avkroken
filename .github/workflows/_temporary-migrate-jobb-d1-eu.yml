name: Temporary inspect Jobb D1 source and EU target

on:
  push:
    branches:
      - chatgpt/d1-eu-migrate/2026-09-25/07-27-jobb

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_W1 }}
      CLOUDFLARE_ACCOUNT_ID: b74f8c0c6a92f3006483840cf27372fd
      SOURCE_DB_ID: 1503cc47-0a05-4129-b192-e92b58c89199
      TARGET_DB_ID: 58219fde-4782-4b28-acb3-186df203f2f7
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Compare schema and row counts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import crypto from "node:crypto";
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const ids={source:process.env.SOURCE_DB_ID,target:process.env.TARGET_DB_ID};
          const base=`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database`;
          const headers={Authorization:`Bearer ${token}`,"Content-Type":"application/json"};
          async function q(id,sql){
            const r=await fetch(`${base}/${id}/query`,{method:"POST",headers,body:JSON.stringify({sql})});
            const b=await r.json();
            if(!r.ok||!b.success||b.result?.some?.(x=>x.success===false)) throw new Error(`query failed ${r.status}`);
            return b.result[0].results;
          }
          const qi=s=>'"'+String(s).replaceAll('"','""')+'"';
          for(const [label,id] of Object.entries(ids)){
            const schema=await q(id,"SELECT type,name,tbl_name,sql FROM sqlite_schema WHERE name NOT LIKE '_cf_%' AND name NOT LIKE 'sqlite_%' ORDER BY type,name");
            const tables=schema.filter(x=>x.type==="table").map(x=>x.name);
            const counts={};
            for(const t of tables) counts[t]=Number((await q(id,`SELECT COUNT(*) AS n FROM ${qi(t)}`))[0].n);
            const normalized=schema.map(x=>({type:x.type,name:x.name,tbl_name:x.tbl_name,sql:x.sql}));
            const hash=crypto.createHash("sha256").update(JSON.stringify(normalized)).digest("hex");
            console.log(JSON.stringify({label,tables,counts,schema_hash:hash,objects:normalized.length}));
          }
          NODE
