name: Temporary finalize Jobb EU D1 cutover

on:
  push:
    branches:
      - chatgpt/d1-eu-migrate/2026-09-25/07-27-jobb

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_W1 }}
      CLOUDFLARE_ACCOUNT_ID: b74f8c0c6a92f3006483840cf27372fd
      SOURCE_DB_ID: 1503cc47-0a05-4129-b192-e92b58c89199
      TARGET_DB_ID: 58219fde-4782-4b28-acb3-186df203f2f7
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Verify Worker deployment and EU target directly
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.1 deployments list --name jobb >/tmp/deployments.txt
          grep -q "968f53d5-caad-46b8-b3d3-7f1469952f65" /tmp/deployments.txt
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          const id=process.env.TARGET_DB_ID;
          const base=`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database`;
          const headers={Authorization:`Bearer ${token}`,"Content-Type":"application/json"};
          const info=await (await fetch(`${base}/${id}`,{headers})).json();
          if(!info.success||info.result.name!=="jobb-eu"||info.result.jurisdiction!=="eu"||info.result.read_replication?.mode!=="disabled") throw new Error("Target D1 metadata mismatch");
          const r=await fetch(`${base}/${id}/query`,{method:"POST",headers,body:JSON.stringify({sql:"SELECT COUNT(*) AS migrations FROM d1_migrations"})});
          const b=await r.json();
          if(!r.ok||!b.success||Number(b.result?.[0]?.results?.[0]?.migrations)!==5) throw new Error("Target D1 query verification failed");
          console.log(JSON.stringify({name:info.result.name,jurisdiction:info.result.jurisdiction,read_replication:info.result.read_replication?.mode,file_size:info.result.file_size,migrations:5}));
          NODE
      - name: Delete retired non-EU Jobb D1
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$SOURCE_DB_ID")"
          echo "old Jobb D1 delete HTTP status: $code"
          [[ "$code" =~ ^2 ]] || { cat /tmp/delete.json; exit 1; }
      - name: Verify old D1 is gone
        shell: bash
        run: |
          set -euo pipefail
          list="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100")"
          printf '%s' "$list" | jq -e --arg old "$SOURCE_DB_ID" --arg eu "$TARGET_DB_ID" '
            (.result | any(.uuid==$old) | not) and
            (.result | any(.uuid==$eu and .name=="jobb-eu" and .jurisdiction=="eu"))
          ' >/dev/null
          echo "Jobb EU D1 cutover finalized"
