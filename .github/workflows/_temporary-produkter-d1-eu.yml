name: Temporary create clean Produkter EU D1 target

on:
  push:
    branches:
      - chatgpt/d1-eu-migrate/2026-09-25/07-48-produkter

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_W1 }}
      CLOUDFLARE_ACCOUNT_ID: b74f8c0c6a92f3006483840cf27372fd
    steps:
      - name: Create clean EU target
        shell: bash
        run: |
          set -euo pipefail
          name="produkter-eu-v2"
          list="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=$name")"
          id="$(printf '%s' "$list" | jq -r --arg n "$name" '.result[] | select(.name==$n) | .uuid' | head -n1)"
          if [[ -z "$id" ]]; then
            response="$(curl -fsS -X POST               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data '{"name":"produkter-eu-v2","jurisdiction":"eu","read_replication":{"mode":"auto"}}'               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
            id="$(printf '%s' "$response" | jq -r '.result.uuid')"
          fi
          detail="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$id")"
          printf '%s' "$detail" | jq -e '.success and .result.name=="produkter-eu-v2" and .result.jurisdiction=="eu" and .result.read_replication.mode=="auto" and (.result.file_size // 0) <= 100000' >/dev/null
          printf '%s' "$detail" | jq -c '{uuid:.result.uuid,name:.result.name,jurisdiction:.result.jurisdiction,read_replication:.result.read_replication.mode,file_size:.result.file_size}'
