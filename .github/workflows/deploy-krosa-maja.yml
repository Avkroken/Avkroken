name: Deploy Krosa-Maja production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: krosa-maja-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Krosa-Maja production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/krosa-maja
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_W1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Validate deployment ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Production deployment must be dispatched from main."; exit 1; }
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate production credential
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::CLOUDFLARE_API_TOKEN_W1 is not configured for this repository."; exit 1; }
      - name: Verify application
        run: npm run check
      - name: Deploy Worker and migrations
        run: npm run deploy
