name: Sync Skvallerbyttan runtime secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skvallerbyttan-production
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Worker-only runtime secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/skvallerbyttan
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_W1 }}
      GAMNACKEN_GITHUB_APP_CLIENT_ID: ${{ vars.GAMNACKEN_GITHUB_APP_CLIENT_ID }}
      GAMNACKEN_GITHUB_APP_PRIVATE_KEY: ${{ secrets.GAMNACKEN_GITHUB_APP_PRIVATE_KEY }}
      SKVALLERBYTTAN_READ_API_TOKEN: ${{ secrets.SKVALLERBYTTAN_READ_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate runtime sync credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN GAMNACKEN_GITHUB_APP_CLIENT_ID GAMNACKEN_GITHUB_APP_PRIVATE_KEY; do
            [[ -n "${!name:-}" ]] || { echo "::error::Required organization secret is not configured: $name"; exit 1; }
          done
          if [[ -z "${SKVALLERBYTTAN_READ_API_TOKEN:-}" ]]; then
            echo "::notice::SKVALLERBYTTAN_READ_API_TOKEN is not configured; machine API secret will not be changed."
          fi
      - name: Verify application
        run: npm run check
      - name: Validate Gamnacken GitHub App source credential
        run: node scripts/verify-github-app-source.mjs
      - name: Sync Worker-only secrets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' | npx wrangler secret bulk
          const values = {
            GAMNACKEN_GITHUB_APP_CLIENT_ID: process.env.GAMNACKEN_GITHUB_APP_CLIENT_ID,
            GAMNACKEN_GITHUB_APP_PRIVATE_KEY: process.env.GAMNACKEN_GITHUB_APP_PRIVATE_KEY,
          };
          if (process.env.SKVALLERBYTTAN_READ_API_TOKEN) {
            values.SKVALLERBYTTAN_READ_API_TOKEN = process.env.SKVALLERBYTTAN_READ_API_TOKEN;
          }
          for (const [name, value] of Object.entries(values)) {
            if (!value) throw new Error(`missing source secret: ${name}`);
          }
          process.stdout.write(JSON.stringify(values));
          NODE
      - name: Verify Worker secret names
        run: npx wrangler secret list
