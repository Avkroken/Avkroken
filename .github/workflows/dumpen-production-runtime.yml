name: Dumpen production runtime

on:
  push:
    branches: [main]
    paths:
      - "apps/dumpen/**"
      - ".github/workflows/dumpen-production-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-runtime:
    name: Dumpen production runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Verify deployed Media Library
        working-directory: apps/dumpen
        run: node scripts/verify-production.mjs
