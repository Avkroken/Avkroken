name: Agent lifecycle signal

on:
  # Trusted default-branch workflow; never check out PR code.
  # Wake the gated reconciliation immediately after new bot commits.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions: {}

jobs:
  signal:
    name: Review/schedule signal
    runs-on: ubuntu-latest
    steps:
      - name: Record reconciliation signal
        run: echo "Agent lifecycle reconciliation requested"
