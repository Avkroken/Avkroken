name: Verify release inventory

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-release-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    name: Read public tags and releases
    if: ${{ github.head_ref == 'chatgpt/portal-v2-architecture/2026-09-26/14-18-del1' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Query exact repositories
        shell: bash
        run: |
          set -euo pipefail

          repos=(
            "blixten85/Avkroken"
            "blixten85/Bastion"
            "blixten85/Politiker"
            "blixten85/Pastebinit"
            "blixten85/Docker-idempotent-update"
            "blixten85/Produkter"
            "blixten85/Klarsprak"
            "blixten85/.github"
          )

          for repo in "${repos[@]}"; do
            echo "::group::$repo"

            releases="$(gh api -H "Accept: application/vnd.github+json" "/repos/$repo/releases?per_page=100")"
            tags="$(gh api -H "Accept: application/vnd.github+json" "/repos/$repo/tags?per_page=100")"

            echo "RELEASE_COUNT_FIRST_PAGE=$(jq 'length' <<<"$releases")"
            echo "TAG_COUNT_FIRST_PAGE=$(jq 'length' <<<"$tags")"
            echo "RELEASE_PAGE_MAY_BE_TRUNCATED=$(jq -r 'length == 100' <<<"$releases")"
            echo "TAG_PAGE_MAY_BE_TRUNCATED=$(jq -r 'length == 100' <<<"$tags")"

            echo "RELEASES_JSON="
            jq -c '[.[] | {tag_name,name,draft,prerelease,published_at,created_at}]' <<<"$releases"

            echo "TAGS_JSON="
            jq -c '[.[] | {name,sha:.commit.sha}]' <<<"$tags"

            echo "::endgroup::"
          done
