name: Automation post-merge dispatch

on:
  workflow_run:
    workflows: ["Agent auto-merge", "Bot PR lifecycle", "Dependabot auto-merge"]
    types: [completed]
  schedule:
    # Reconciliation recovers pending workflow_run events discarded by GitHub concurrency.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

# Serialize dispatch decisions. The periodic reconciliation repairs lost pending
# signals and validates the latest main SHA, which includes every preceding merge.
concurrency:
  group: post-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile merged automation on main
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Checkout trusted repository scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Reconcile missing CI or release for default-branch tip
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/automation_post_merge.py
