# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true

reviews:
  request_changes_workflow: false
  path_instructions:
    - path: "apps/portal/**"
      instructions: |
        Review Portal as a presentation, navigation, and aggregation layer.
        Protected Jobb content must be rejected server-side before data fetch.
        API and asset routes must not inherit SPA document fallbacks.
        Preserve graceful degradation, canonical-source links, keyboard access,
        focus visibility, reduced motion, and public-search indexing boundaries.
    - path: "apps/skvallerbyttan/**"
      instructions: |
        Treat provider access as strictly read-only.
        Capability keys, status values, provenance, and /api/v1 are machine-consumed contracts.
        Never expose secret/token/private-key values or raw sensitive provider payloads.
        Distinguish observed/partial data from complete state and preserve freshness metadata.
    - path: "apps/jobb/**"
      instructions: |
        Review auth, provider automation, and state transitions fail-closed.
        D1 is canonical run/application state; R2 evidence is supporting data.
        Browser Run is the browser integration boundary.
        Do not automate user-controlled BankID/e-identification signing.
        Preserve the exact monthly suitability/application limit and explicit evidence.
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: true
    autofix:
      enabled: true
    fix_ci:
      enabled: true
    resolve_merge_conflict:
      enabled: true
  pre_merge_checks:
    override_requested_reviewers_only: true
    docstrings:
      mode: error
      threshold: 100

code_generation:
  docstrings:
    path_instructions:
      - path: "apps/portal/src/**/*.{js,mjs}"
        instructions: |
          Use JSDoc for reusable and exported functions/classes.
          Include @param and @returns when applicable and @throws for meaningful failures.
          Document route/cache/auth side effects, external GitHub/Cloudflare boundaries,
          fallback behavior, and whether returned data is public or protected.
      - path: "apps/portal/public/**/*.js"
        instructions: |
          Use concise JSDoc for reusable client functions.
          Document DOM mutations, keyboard/focus behavior, network calls, and accessibility
          effects; avoid comments that merely restate selectors or implementation.
      - path: "apps/portal/test/**/*"
        instructions: |
          Keep test documentation concise and state the routing, security, accessibility,
          or rendering contract protected by the test.
      - path: "apps/skvallerbyttan/src/**/*.ts"
        instructions: |
          Use TSDoc with @param, @returns, and @throws where applicable.
          For provider reads document capability/provenance semantics, partial-data behavior,
          cache/freshness behavior, rate-limit effects, and secret-redaction boundaries.
          For public/API functions identify stable machine-consumed contracts.
      - path: "apps/skvallerbyttan/test/**/*"
        instructions: |
          Keep test docstrings concise.
          State which read-only, normalization, status/provenance, redaction, webhook,
          cache, or API-contract regression is being protected.
      - path: "apps/jobb/apps/web/src/**/*.ts"
        instructions: |
          Use TSDoc for exported or non-trivial functions/classes.
          Document auth requirements, D1/R2/Browser/Workflow side effects, fail-closed
          decisions, provider calls, and externally observable state transitions.
      - path: "apps/jobb/packages/**/src/**/*.ts"
        instructions: |
          Use TSDoc for provider/core APIs.
          Document trusted URL/domain assumptions, credential boundaries, browser/API
          side effects, idempotency, error behavior, and caller-visible results.
      - path: "apps/jobb/**/*.test.{ts,mjs}"
        instructions: |
          Keep documentation concise and describe the security, provider, time-window,
          suitability, state, or reporting invariant being tested.
  unit_tests:
    path_instructions:
      - path: "apps/portal/**/*.{js,mjs}"
        instructions: |
          Follow existing node:test patterns.
          Prioritize protected-route rejection, API-versus-SPA routing, canonical sources,
          degraded provider behavior, search visibility, and accessibility DOM contracts.
      - path: "apps/skvallerbyttan/src/**/*.ts"
        instructions: |
          Follow existing tsx/node test conventions.
          Cover read-only provider behavior, permission/status classification, secret
          redaction, normalization/provenance, freshness/cache behavior, webhook validation,
          and stable /api/v1 contracts.
      - path: "apps/jobb/**/*.ts"
        instructions: |
          Follow existing Vitest/package conventions.
          Prioritize fail-closed auth/provider behavior, trusted URLs, D1 canonical state,
          R2 evidence boundaries, automation date/month limits, idempotency, provider
          failures, and user-controlled authentication/signing boundaries.
